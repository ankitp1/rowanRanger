<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranger Rowan: Master Scout</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        .kids-font { font-family: 'Luckiest Guy', cursive; }
        ::-webkit-scrollbar { display: none; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .emoji-shadow { text-shadow: 0px 4px 8px rgba(0,0,0,0.2); }
        .footer-btn { flex: 1; max-width: 85px; aspect-ratio: 1/1; }
        .persona-btn { flex: 0 0 auto; transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-stone-100 font-sans select-none overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- MASTER DATA ---
        const DEFAULT_ITEMS = [
            { id: 'waterfall', name: 'Waterfall', emoji: '💦', bg: 'bg-blue-50', info: "That water is loud and strong! It travels all the way to the ocean!" },
            { id: 'mushroom', name: 'Mushroom', emoji: '🍄', bg: 'bg-red-50', info: "Mushrooms help old trees turn back into soil. Look but don't touch!" },
            { id: 'bridge', name: 'Bridge', emoji: '🌉', bg: 'bg-slate-100', info: "Hold the railing! We are very high up above the river!" },
            { id: 'acorn', name: 'Acorn', emoji: '🌰', bg: 'bg-yellow-50', info: "This is a baby Oak tree in a hard shell. It is a gift for squirrels!" },
            { id: 'tracks', name: 'Tracks', emoji: '🐾', bg: 'bg-stone-100', info: "An animal walked right here! Let's follow the clues in the mud." },
            { id: 'feather', name: 'Feather', emoji: '🪶', bg: 'bg-gray-50', info: "A bird left a gift for you! Is it soft like a cloud?" },
            { id: 'pinecone', name: 'Pinecone', emoji: '🌲', bg: 'bg-emerald-50', info: "Pinecones protect seeds from the cold winter. They are very prickly!" },
            { id: 'flower', name: 'Flower', emoji: '🌸', bg: 'bg-rose-50', info: "Flowers are nature's way of saying hello to the bees!" },
            { id: 'rock', name: 'Rock', emoji: '🪨', bg: 'bg-stone-200', info: "Rocks tell stories about the earth. Is this one smooth or bumpy?" },
            { id: 'bug', name: 'Bug', emoji: '🐞', bg: 'bg-red-50', info: "Bugs are forest helpers. Give this one a high-five!" },
            { id: 'bird', name: 'Bird', emoji: '🐦', bg: 'bg-sky-50', info: "Listen to the bird's song! I wish I could fly like that!" },
            { id: 'worm', name: 'Worm', emoji: '🪱', bg: 'bg-pink-50', info: "Worms are the forest's tiny gardeners. Wiggle wiggle!" },
            { id: 'clover', name: 'Clover', emoji: '🍀', bg: 'bg-green-50', info: "Clovers make a lucky carpet. Can you find one with four leaves?" },
            { id: 'moss', name: 'Moss', emoji: '🧤', bg: 'bg-emerald-100', info: "Moss feels like a cold, wet sponge. It's a bed for fairies!" },
            { id: 'sticks', name: 'Sticks', emoji: '🪵', bg: 'bg-amber-100', info: "Nature's building blocks! You can make a house or a wand!" },
            { id: 'nest', name: 'Nest', emoji: '🪹', bg: 'bg-yellow-100', info: "A safe, cozy home for baby birds. It's made of twigs and mud!" },
            { id: 'leaf', name: 'Leaf', emoji: '🍂', bg: 'bg-orange-50', info: "Crunchy under your boots! I love that crunch-crunch sound!" },
            { id: 'stump', name: 'Stump', emoji: '🪵', bg: 'bg-stone-300', info: "A perfect forest seat! This used to be a very tall tree." },
            { id: 'stairs', name: 'Stairs', emoji: '🪜', bg: 'bg-gray-200', info: "So many steps! Let's count them together while we climb!" },
            { id: 'beach', name: 'Beach', emoji: '🏖️', bg: 'bg-yellow-100', info: "A sandy spot near the water! Is the sand warm?" },
            { id: 'ant', name: 'Ant', emoji: '🐜', bg: 'bg-stone-200', info: "Ants are super strong! They can carry things bigger than them!" },
            { id: 'fern', name: 'Fern', emoji: '🌿', bg: 'bg-green-100', info: "Ferns lived with the dinosaurs! They look like giant green fans." },
            { id: 'tightrope', name: 'Tightrope', emoji: '🎡', bg: 'bg-purple-100', info: "A brave man walked across the gorge here! It's a long way down!" },
            { id: 'bark', name: 'Bark', emoji: '🧱', bg: 'bg-stone-200', info: "The tree's protective skin. It's rough and scratchy!" },
            { id: 'grass', name: 'Grass', emoji: '🌱', bg: 'bg-green-50', info: "Nature's green blanket. It's very tickly on your toes!" },
            { id: 'seed', name: 'Seed', emoji: '🌑', bg: 'bg-stone-50', info: "The start of something big! A tiny baby plant in a shell." }
        ];

        const PERSONAS = {
            bear: { id: 'bear', name: 'Barnaby Bear', color: 'bg-amber-800', pitch: 0.5, rate: 0.60, emoji: '🐻', intro: "Heeey there, Rowan... Barnaby Bear here... " },
            fox: { id: 'fox', name: 'Fiona Fox', color: 'bg-orange-600', pitch: 1.4, rate: 0.80, emoji: '🦊', intro: "Ooh! Hi Rowan! I'm Fiona! " },
            deer: { id: 'deer', name: 'Daisy Deer', color: 'bg-rose-400', pitch: 1.1, rate: 0.65, emoji: '🦌', intro: "Shhh... hello Rowan. Let's be very gentle... " },
            ranger: { id: 'ranger', name: 'Ranger Rick', color: 'bg-green-700', pitch: 1.0, rate: 0.75, emoji: '🤠', intro: "Ranger Rick here! Reporting for duty! " },
            squirrel: { id: 'squirrel', name: 'Silly Sammy', color: 'bg-amber-500', pitch: 1.8, rate: 0.85, emoji: '🐿️', intro: "Squeak! Wow! Look at that! Squeak! " }
        };

        const MISSIONS = [
            "Action Mission! Walk like a heavy bear for ten steps! ROAR!",
            "Action Mission! Hop like a tiny frog five times! Ribbit!",
            "Detective Mission! Find a leaf that is bigger than your hand!",
            "Color Mission! Find three different things that are green!",
            "Sensory Mission! Give a tree a big hug! Is it scratchy?",
            "Action Mission! Run to the next tree like a cheetah!",
            "Sensory Mission! Close your eyes... can you feel the wind?",
            "Action Mission! Spin around like a falling leaf!",
            "Detective Mission! Find a leaf that was nibbled by a bug!",
            "Action Mission! Stand on one leg like a sleepy bird!"
        ];

        const FACTS = ["Forests produce oxygen!", "Trees talk underground!", "A snail can sleep for 3 years!", "One tree can absorb 150kg of CO2!"];
        const JOKES = ["Why did the leaf go to the doctor? He was feeling green!", "What's a squirrel's game? Hide and Squeak!", "How do trees get online? They log in!"];

        // --- APP ---

        function App() {
            const [found, setFound] = useState(() => JSON.parse(localStorage.getItem('rowan-f-final')) || {});
            const [customItems, setCustomItems] = useState(() => JSON.parse(localStorage.getItem('rowan-c-final')) || []);
            const [trashCount, setTrashCount] = useState(() => JSON.parse(localStorage.getItem('rowan-t-final')) || 0);
            const [activePersona, setActivePersona] = useState(PERSONAS.bear);
            const [adminMode, setAdminMode] = useState(false);
            const [headerTaps, setHeaderTaps] = useState(0);
            const [badge, setBadge] = useState(false);
            const [isQuiet, setIsQuiet] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', emoji: '', info: '' });

            const allItems = [...DEFAULT_ITEMS, ...customItems];

            useEffect(() => {
                localStorage.setItem('rowan-f-final', JSON.stringify(found));
                localStorage.setItem('rowan-c-final', JSON.stringify(customItems));
                localStorage.setItem('rowan-t-final', JSON.stringify(trashCount));
                
                if (Object.keys(found).length >= 10 && !badge) {
                    setBadge(true);
                    confetti({ particleCount: 200, spread: 90 });
                    speak("AMAZING! Rowan, you found TEN treasures! You are a Grand Explorer!", activePersona);
                }
            }, [found, customItems, trashCount]);

            const speak = (text, persona) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const naturalVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Google US English')) || voices[0];
                if (naturalVoice) u.voice = naturalVoice;
                u.pitch = persona.pitch;
                u.rate = persona.rate;
                window.speechSynthesis.speak(u);
            };

            const handlePersonaClick = (p) => {
                setActivePersona(p);
                speak(p.intro + " Let's find some treasures together!", p);
            };

            const handleItemClick = (item) => {
                const isFirst = !found[item.id];
                setFound(prev => ({ ...prev, [item.id]: (prev[item.id] || 0) + 1 }));
                const message = isFirst 
                    ? `${activePersona.intro} Rowan, look! A ${item.name}! ${item.info}`
                    : `Another ${item.name}! You are a pro at this, Rowan!`;
                speak(message, activePersona);
            };

            return (
                <div className={`min-h-screen pb-52 transition-all ${isQuiet ? 'bg-black' : 'bg-stone-100'}`}>
                    
                    {/* Header */}
                    <div className="bg-white p-3 flex justify-between items-center border-b-2 border-stone-200 sticky top-0 z-[60]">
                        <h1 onClick={() => { setHeaderTaps(h => h + 1); if(headerTaps >= 4) { setAdminMode(true); setHeaderTaps(0); speak("Admin mode open.", activePersona); } }} 
                            className="kids-font text-emerald-800 text-lg uppercase">Ranger Rowan</h1>
                        <button onClick={() => { if(window.confirm("Start over?")) { setFound({}); setTrashCount(0); setBadge(false); } }} 
                            className="bg-red-50 text-red-500 px-4 py-2 rounded-full text-[12px] kids-font uppercase">New Trip</button>
                    </div>

                    {/* Admin Panel */}
                    {adminMode && (
                        <div className="fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold">Admin Panel</h2>
                                <button onClick={() => setAdminMode(false)} className="bg-black text-white px-4 py-2 rounded-lg">Close</button>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); setCustomItems([...customItems, {...newItem, id: 'c-'+Date.now(), bg: 'bg-white'}]); setNewItem({name:'', emoji:'', info:''}); speak("Added!", activePersona); }} className="space-y-4 bg-gray-50 p-4 rounded-xl border mb-6">
                                <input placeholder="Name" className="w-full p-3 border rounded" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                                <input placeholder="Emoji" className="w-full p-3 border rounded text-2xl" value={newItem.emoji} onChange={e => setNewItem({...newItem, emoji: e.target.value})} />
                                <textarea placeholder="Description" className="w-full p-3 border rounded" value={newItem.info} onChange={e => setNewItem({...newItem, info: e.target.value})} />
                                <button type="submit" className="w-full bg-green-600 text-white p-4 rounded-xl font-bold">Add Item</button>
                            </form>
                            <div className="space-y-2">
                                {customItems.map(i => <div key={i.id} className="flex justify-between bg-white p-3 border rounded"><span>{i.emoji} {i.name}</span><button onClick={()=>setCustomItems(customItems.filter(ci=>ci.id!==i.id))} className="text-red-500">Delete</button></div>)}
                            </div>
                        </div>
                    )}

                    {/* Persona Bar */}
                    <div className="bg-white p-4 shadow-xl flex overflow-x-auto gap-4 snap-x border-b-4 border-stone-200">
                        {Object.values(PERSONAS).map(pers => (
                            <button key={pers.id} onClick={() => handlePersonaClick(pers)}
                                className={`persona-btn snap-center flex flex-col items-center p-4 rounded-[2.5rem] min-w-[110px] ${activePersona.id === pers.id ? `${pers.color} text-white scale-110 shadow-lg` : 'bg-stone-50 text-stone-400'}`}>
                                <span className="text-5xl mb-1">{pers.emoji}</span>
                                <span className="kids-font text-[11px] uppercase whitespace-nowrap">{pers.name.split(' ')[1]}</span>
                            </button>
                        ))}
                    </div>

                    {/* Mission Bar */}
                    {!isQuiet && (
                        <div className="p-4">
                            <button onClick={() => speak(MISSIONS[Math.floor(Math.random()*MISSIONS.length)], activePersona)} 
                                className="w-full bg-white border-4 border-dashed border-orange-400 p-6 rounded-[2rem] flex items-center justify-between shadow-md active:scale-95">
                                <span className="text-5xl">🧭</span>
                                <span className="kids-font text-orange-800 text-2xl uppercase">Mission!</span>
                                <span className="text-4xl animate-pulse">👉</span>
                            </button>
                        </div>
                    )}

                    {/* Grid */}
                    {!isQuiet && (
                        <div className="p-4 grid-container">
                            {allItems.map(item => (
                                <button key={item.id} onClick={() => handleItemClick(item)}
                                    className={`relative aspect-square rounded-[3rem] border-8 flex flex-col items-center justify-center transition-all active:scale-90 ${found[item.id] ? 'border-green-500 bg-white shadow-xl' : `${item.bg} border-white shadow-sm`}`}>
                                    <span className="text-7xl emoji-shadow mb-2">{item.emoji}</span>
                                    <span className="kids-font text-xl uppercase text-stone-700 tracking-tighter">{item.name}</span>
                                    {found[item.id] > 0 && <div className="absolute -top-4 -right-4 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center border-4 border-white kids-font text-2xl shadow-lg">{found[item.id]}</div>}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Badge */}
                    {badge && (
                        <div className="fixed inset-0 bg-stone-900/95 z-[100] flex flex-col items-center justify-center p-8 text-center" onClick={() => setBadge(false)}>
                            <span className="text-[140px] animate-bounce mb-8">🎖️</span>
                            <h2 className="kids-font text-5xl text-white mb-2 uppercase tracking-widest">Master Ranger</h2>
                            <h3 className="kids-font text-8xl text-yellow-400 underline italic">ROWAN</h3>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md p-4 flex justify-around border-t-8 border-stone-200 z-50">
                        <button onClick={() => speak(`Rowan, did you know? ${FACTS[Math.floor(Math.random()*FACTS.length)]}`, activePersona)} className="footer-btn bg-blue-500 text-white rounded-3xl flex items-center shadow-xl"><span className="text-5xl">🧐</span></button>
                        <button onClick={() => { setIsQuiet(true); speak("Shh... listen for five seconds.", activePersona); setTimeout(()=>setIsQuiet(false), 7000); }} className="footer-btn bg-indigo-500 text-white rounded-3xl flex items-center shadow-xl"><span className="text-5xl">👂</span></button>
                        <button onClick={() => { setTrashCount(c=>c+1); speak("Wow! Trash Hero Rowan!", activePersona); confetti(); }} className="footer-btn bg-emerald-500 text-white rounded-3xl flex items-center shadow-xl relative">
                            <span className="text-5xl">🚮</span>
                            {trashCount > 0 && <div className="absolute -top-2 -right-2 bg-red-500 text-white w-9 h-9 rounded-full flex items-center justify-center text-sm kids-font border-2 border-white">{trashCount}</div>}
                        </button>
                        <button onClick={() => speak(JOKES[Math.floor(Math.random()*JOKES.length)], activePersona)} className="footer-btn bg-yellow-400 text-yellow-900 rounded-3xl flex items-center shadow-xl"><span className="text-5xl">😂</span></button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
