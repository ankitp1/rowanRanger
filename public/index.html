<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranger Rowan: Ultimate Adventure</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap');
        .kids-font { font-family: 'Luckiest Guy', cursive; }
        ::-webkit-scrollbar { display: none; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .emoji-shadow { text-shadow: 0px 4px 8px rgba(0,0,0,0.2); }
        /* Ensure footer buttons don't get too small on narrow phones */
        .footer-btn { flex: 1; max-width: 85px; aspect-ratio: 1/1; }
    </style>
</head>
<body class="bg-stone-100 font-sans select-none overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PERSONAS = {
            ranger: { id: 'ranger', name: 'Ranger Rick', color: 'bg-green-600', pitch: 1.0, rate: 0.9, emoji: '🤠', catch: "Ranger Rick here! Let's keep the park safe!" },
            squirrel: { id: 'squirrel', name: 'Silly Sammy', color: 'bg-orange-500', pitch: 1.7, rate: 1.3, emoji: '🐿️', catch: "Squeak! I'm Silly Sammy! Look at all the stuff!" },
            owl: { id: 'owl', name: 'Wise Owl', color: 'bg-indigo-600', pitch: 0.7, rate: 0.7, emoji: '🦉', catch: "Hoo-hoo... the forest is a great teacher." },
            bee: { id: 'bee', name: 'Buzzy Bea', color: 'bg-yellow-400', pitch: 1.9, rate: 1.5, emoji: '🐝', catch: "Bzzz-bzzz! Wow! Look at those pretty flowers!" },
            groundhog: { id: 'groundhog', name: 'Grumpy Gus', color: 'bg-stone-600', pitch: 0.5, rate: 0.8, emoji: '🪵', catch: "Ugh, is it morning? I was busy digging." }
        };

        const ITEMS = [
            { id: 'waterfall', name: 'Waterfall', emoji: '💦', bg: 'bg-blue-50', d: { ranger: "Tallulah has 6 waterfalls! Hear the roar?", squirrel: "Splish splash! Don't get me wet!", owl: "Ancient water carving the rock.", bee: "Sparkly diamonds! Bzzz!", groundhog: "Too loud for my nap." }},
            { id: 'mushroom', name: 'Mushroom', emoji: '🍄', bg: 'bg-red-50', d: { ranger: "Look but don't touch! Nature's recyclers.", squirrel: "A tiny bug umbrella!", owl: "Earth's hidden magic.", bee: "Bzzz! A perfect landing pad!", groundhog: "Mushy and weird. I like roots." }},
            { id: 'bridge', name: 'Bridge', emoji: '🌉', bg: 'bg-slate-100', d: { ranger: "Hold the railing! It's the Suspension Bridge!", squirrel: "BOING! BOING! It's so wiggly!", owl: "A steel path over the deep gorge.", bee: "Bzzz! A high-flying road!", groundhog: "Too high. My tummy feels funny." }},
            { id: 'acorn', name: 'Acorn', emoji: '🌰', bg: 'bg-yellow-50', d: { ranger: "This will grow into a giant Oak tree!", squirrel: "MINE! I'm hiding this one later!", owl: "A tiny seed of great strength.", bee: "Bzzz! A very fancy hat!", groundhog: "Crunchy. Good for the teeth." }},
            { id: 'tracks', name: 'Tracks', emoji: '🐾', bg: 'bg-stone-100', d: { ranger: "Follow the clues! Who walked here?", squirrel: "Maybe a giant squirrel friend?!", owl: "A story written in the mud.", bee: "Bzzz! Why walk? Flying is better!", groundhog: "Hey! Who stepped in my yard?" }},
            { id: 'feather', name: 'Feather', emoji: '🪶', bg: 'bg-gray-50', d: { ranger: "A bird left a gift! Is it soft?", squirrel: "I wish I had wings to fly home!", owl: "A silent gift from the sky.", bee: "Like a soft cloud! Bzzz!", groundhog: "Achoo! Tickles my nose." }},
            { id: 'playground', name: 'Playground', emoji: '🛝', bg: 'bg-orange-50', d: { ranger: "Safety first! Have fun on the slides!", squirrel: "I'm the king of the jungle gym!", owl: "Young explorers at play.", bee: "Bzzz! So many colors and kids!", groundhog: "Too much shouting. I'm staying under." }},
            { id: 'pinecone', name: 'Pinecone', emoji: '🌲', bg: 'bg-emerald-50', d: { ranger: "Pinecones protect seeds from the cold.", squirrel: "These are my snack boxes!", owl: "A woody seed fortress.", bee: "Too scratchy! I like flowers!", groundhog: "They fall on my head. Bonk!" }},
            { id: 'squirrel', name: 'Squirrel', emoji: '🐿️', bg: 'bg-orange-100', d: { ranger: "They are very busy today.", squirrel: "Hey! Look! It's my cousin!", owl: "A fast forest friend.", bee: "Bzzz! Stop running and smell flowers!", groundhog: "My noisy neighbors." }},
            { id: 'bird', name: 'Bird', emoji: '🐦', bg: 'bg-sky-50', d: { ranger: "Listen to that song!", squirrel: "I wish I could fly to the top!", owl: "A sky-traveler passing through.", bee: "Bzzz! Watch the big wings!", groundhog: "I prefer the tunnels." }},
            { id: 'worm', name: 'Worm', emoji: '🪱', bg: 'bg-pink-50', d: { ranger: "Worms help the dirt stay healthy.", squirrel: "Wiggle wiggle! He's slow!", owl: "A snack for the early bird.", bee: "Bzzz! Too dark for me!", groundhog: "My best friends." }},
            { id: 'flower', name: 'Flower', emoji: '🌸', bg: 'bg-rose-50', d: { ranger: "Bees love these colors!", squirrel: "Smells way better than my tree hole!", owl: "The forest's bright smile.", bee: "OH MY GOSH! A FLOWER! BZZZZ!", groundhog: "I'll eat it later." }},
            { id: 'clover', name: 'Clover', emoji: '🍀', bg: 'bg-green-50', d: { ranger: "Can you find one with four leaves?", squirrel: "Yummy green snack!", owl: "A lucky carpet.", bee: "Clover nectar is the best!", groundhog: "Breakfast is served." }},
            { id: 'moss', name: 'Moss', emoji: '🧤', bg: 'bg-emerald-100', d: { ranger: "Feels like a cold sponge!", squirrel: "The world's softest bed!", owl: "Nature's green velvet.", bee: "A soft landing pad!", groundhog: "I use this to line my tunnel." }},
            { id: 'rock', name: 'Rock', emoji: '🪨', bg: 'bg-stone-200', d: { ranger: "Is it smooth or bumpy?", squirrel: "I hide my best nuts under these!", owl: "A piece of the mountain's heart.", bee: "Bzzz! A warm sun-stone!", groundhog: "I have a big collection." }},
            { id: 'sticks', name: 'Sticks', emoji: '🪵', bg: 'bg-amber-100', d: { ranger: "Nature's building blocks.", squirrel: "I use these for my nest!", owl: "Fallen limbs of the giants.", bee: "A bridge for ants!", groundhog: "Good for itching my back." }},
            { id: 'nest', name: 'Nest', emoji: '🪹', bg: 'bg-yellow-100', d: { ranger: "A safe home for babies.", squirrel: "I build my nests high up too!", owl: "A masterwork of twigs.", bee: "Bzzz! A cozy basket!", groundhog: "I like my basement." }},
            { id: 'leaf', name: 'Leaf', emoji: '🍂', bg: 'bg-orange-50', d: { ranger: "Crunchy under your boots!", squirrel: "CRUNCH! I love that sound!", owl: "The earth's fallen gold.", bee: "A little brown boat!", groundhog: "Too noisy for sneaking." }},
            { id: 'stump', name: 'Stump', emoji: '🪵', bg: 'bg-stone-300', d: { ranger: "A perfect forest seat.", squirrel: "Leftovers of a giant tree!", owl: "A podium for squirrels.", bee: "Bzzz! A flat island!", groundhog: "A great roof for my tunnel." }},
            { id: 'stairs', name: 'Stairs', emoji: '🪜', bg: 'bg-gray-200', d: { ranger: "So many steps! Let's count!", squirrel: "I can climb these so fast!", owl: "A long path to the deep.", bee: "Bzzz! Just fly up!", groundhog: "My legs are too short." }},
            { id: 'beach', name: 'Beach', emoji: '🏖️', bg: 'bg-yellow-100', d: { ranger: "The Tallulah beach! Is it sandy?", squirrel: "I'm staying away from big water!", owl: "Where water meets shore.", bee: "Bzzz! So much sand!", groundhog: "I love digging here." }},
            { id: 'ant', name: 'Ant', emoji: '🐜', bg: 'bg-stone-200', d: { ranger: "Ants are super strong!", squirrel: "Look at him go!", owl: "A tiny, busy worker.", bee: "Bzzz! The ground-version of me!", groundhog: "Get out of my kitchen!" }},
            { id: 'fern', name: 'Fern', emoji: '🌿', bg: 'bg-green-100', d: { ranger: "Ferns lived with dinosaurs!", squirrel: "A giant green feather!", owl: "An ancient green fan.", bee: "Bzzz! Prehistoric hideout!", groundhog: "Soft for a nap." }},
            { id: 'tightrope', name: 'Tightrope', emoji: '🎡', bg: 'bg-purple-100', d: { ranger: "A man walked across the gorge!", squirrel: "Brave as a squirrel!", owl: "A very high path.", bee: "Bzzz! I fly across easily!", groundhog: "No thank you." }},
            { id: 'bark', name: 'Bark', emoji: '🧱', bg: 'bg-stone-200', d: { ranger: "The tree's protective skin.", squirrel: "Scratch my back!", owl: "The wrinkles of old trees.", bee: "Bzzz! Rough mountains!", groundhog: "Hard and scratchy." }},
            { id: 'grass', name: 'Grass', emoji: '🌱', bg: 'bg-green-50', d: { ranger: "Nature's green blanket.", squirrel: "Hiding nuts in here!", owl: "A sea of green.", bee: "Bzzz! A bug jungle!", groundhog: "Lunch is everywhere!" }},
            { id: 'seed', name: 'Seed', emoji: '🌑', bg: 'bg-stone-50', d: { ranger: "The start of something big!", squirrel: "A tiny snack!", owl: "A promise of a new plant.", bee: "Bzzz! Baby tree!", groundhog: "I've got a million." }}
        ];

        const FACTS = ["Forests cover about 31% of the land area on Earth.", "Trees act as the lungs of the planet by producing oxygen.", "Trees help fight climate change by absorbing carbon dioxide.", "Over 80% of land animals and plants live in forests.", "One tree can absorb 150 kg of carbon dioxide per year.", "Forests can actually create their own rain!", "There are over 60,000 known tree species in the world.", "Forests can cool the air by up to 8 degrees!", "Forests help prevent flooding by absorbing rainwater.", "Tree roots anchor the soil, preventing erosion.", "Trees talk to each other through underground fungus networks!", "The Amazon rainforest is the largest in the world.", "Rainforests get rain almost every day!", "The top layer of a forest is called the canopy.", "Deciduous trees lose their leaves in the fall.", "Evergreen trees keep their needles all year.", "You can count tree rings to find out how old a tree is.", "Trees provide humans with fruits, nuts, berries, and syrup!", "Wood from forests is used to build houses and furniture.", "Many medicines are made from forest plants.", "Trees are excellent at storing carbon underground.", "Forests are great for mental health and relaxation.", "You can often find hidden waterfalls in forests.", "Some forests are over 100 million years old!", "Pine trees are known for their strong scent.", "The bark of a tree protects it from fire and insects."];

        const JOKES = ["Why did the leaf go to the doctor? He was feeling green!", "What's a squirrel's favorite game? Hide and Squeak!", "How do trees get online? They log in!", "Why don't grasshoppers watch soccer? They prefer hop-scotch!", "What do you call a cold forest? For-reezing!", "What did the tree say to the wind? Leaf me alone!", "How do you identify a dogwood tree? By its bark!", "Why did the owl invite his friends over? He didn't want to be owl-by-himself!", "What do you call a bear with no teeth? A gummy bear!", "Why are fish so smart? Because they live in schools!", "What is a frog's favorite drink? Croak-a-cola!", "Why did the mushroom go to the party? Because he was a fun-guy!", "What animal is the best at baseball? A bat!", "How do you get a squirrel to like you? Act like a nut!", "What is a tree's favorite drink? Root beer!", "What is a penguin's favorite relative? Aunt-arctica!", "What kind of flower is on your face? Tulips!", "Where do cows go for a date? To the mooo-vies!", "What did the little flower say to the big flower? Hi bud!", "What kind of tree fits in your hand? A palm tree!", "What did the beaver say to the tree? It was nice gnawing you!", "What do you call an alligator in a vest? An investi-gator!", "What did the ocean say to the beach? Nothing, it just waved!", "How do you make a tissue dance? Put a little boogey in it!"];

        const MAP_MISSIONS = ["Find the Suspension Bridge! Can you walk across without wobbling?", "Find the Tightrope Spot! It's 1,000 feet deep!", "Go to the Playground! Find a bird's nest nearby!", "Find the Beach! Is the water cold?", "Find a staircase! Count ten steps!", "Find the Interpretive Center! What is the biggest animal inside?", "Find a Pine tree. Does it smell like Christmas?", "Find a rock colder than your nose!", "Touch a tree. Is it bumpy or smooth?"];

        function App() {
            const [found, setFound] = useState(() => JSON.parse(localStorage.getItem('rowan-final-hunt-v8')) || {});
            const [trashCount, setTrashCount] = useState(() => JSON.parse(localStorage.getItem('rowan-trash-hero')) || 0);
            const [p, setP] = useState(() => JSON.parse(localStorage.getItem('rowan-p-final-v8')) || PERSONAS.ranger);
            const [badge, setBadge] = useState(false);
            const [isQuiet, setIsQuiet] = useState(false);

            useEffect(() => {
                localStorage.setItem('rowan-final-hunt-v8', JSON.stringify(found));
                localStorage.setItem('rowan-trash-hero', JSON.stringify(trashCount));
                localStorage.setItem('rowan-p-final-v8', JSON.stringify(p));
                if (Object.keys(found).length === 12 && !badge) {
                    setBadge(true);
                    confetti({ particleCount: 200, spread: 90 });
                    speak("ROWAN! YOU ARE THE ULTIMATE MASTER RANGER! YOU FOUND TWELVE TREASURES!");
                }
            }, [found, trashCount, p]);

            const speak = (text, pOverride) => {
                const active = pOverride || p;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.pitch = active.pitch; u.rate = active.rate;
                window.speechSynthesis.speak(u);
            };

            const startListening = () => {
                setIsQuiet(true);
                speak("Shhh... Rowan. Close your eyes. Listen to the forest for 5 seconds.");
                setTimeout(() => { setIsQuiet(false); speak("Okay! What did you hear? Water? Birds? Wind?"); }, 7000);
            };

            const doTrashHero = () => {
                setTrashCount(c => c + 1);
                const msgs = {
                    ranger: "Trash Hero Rowan! You're keeping Tallulah clean and safe!",
                    squirrel: "Squeak! Thank you for picking up that litter! My home looks great!",
                    owl: "Wise choice, Rowan. A true Ranger leaves no trace.",
                    bee: "Bzzz! Now the flowers look beautiful! You are a hero!",
                    groundhog: "Clean dirt is the best dirt. Thanks for the help, kid."
                };
                speak(msgs[p.id]);
                confetti({ particleCount: 40, spread: 50, colors: ['#10b981'] });
            };

            const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            return (
                <div className={`min-h-screen pb-52 transition-all ${isQuiet ? 'bg-black' : 'bg-stone-100'}`}>
                    {/* Persona Bar */}
                    <div className="bg-white p-4 sticky top-0 z-50 shadow-xl border-b-4 border-stone-200 flex overflow-x-auto gap-4 snap-x">
                        {Object.values(PERSONAS).map(pers => (
                            <button key={pers.id} onClick={() => { setP(pers); speak(pers.catch, pers); }}
                                className={`persona-btn snap-center flex flex-col items-center p-4 rounded-[2.5rem] min-w-[100px] transition-all ${p.id === pers.id ? `${pers.color} text-white scale-110 shadow-lg` : 'bg-stone-50'}`}>
                                <span className="text-5xl mb-1">{pers.emoji}</span>
                                <span className="kids-font text-[10px] uppercase tracking-tighter">{pers.name.split(' ')[1]}</span>
                            </button>
                        ))}
                    </div>

                    {/* Mission Header */}
                    {!isQuiet && (
                        <div className="p-4">
                            <button onClick={() => speak(`Mission Time! ${getRandom(MAP_MISSIONS)}`)} 
                                className="w-full bg-white border-4 border-dashed border-orange-400 p-4 rounded-3xl flex items-center justify-between shadow-md active:scale-95">
                                <span className="text-4xl">🧭</span>
                                <span className="kids-font text-orange-800 text-xl uppercase tracking-tighter">Ranger Mission!</span>
                                <span className="text-4xl">👉</span>
                            </button>
                        </div>
                    )}

                    {/* Treasure Grid */}
                    {!isQuiet && (
                        <div className="p-4 grid-container">
                            {ITEMS.map(item => (
                                <button key={item.id} onClick={() => {
                                    const isFirst = !found[item.id];
                                    setFound(prev => ({ ...prev, [item.id]: (prev[item.id] || 0) + 1 }));
                                    speak(isFirst ? `Look Rowan! A ${item.name}! ${item.d[p.id]}` : `Another ${item.name}! Great job!`);
                                }}
                                className={`relative aspect-square rounded-[3rem] border-8 flex flex-col items-center justify-center transition-all active:scale-90 ${found[item.id] ? 'border-green-500 bg-white shadow-xl' : `${item.bg} border-white shadow-sm`}`}>
                                    <span className="text-7xl emoji-shadow mb-2">{item.emoji}</span>
                                    <span className="kids-font text-xl uppercase text-stone-700 tracking-tighter">{item.name}</span>
                                    {found[item.id] > 0 && (
                                        <div className="absolute -top-4 -right-4 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center border-4 border-white kids-font text-2xl shadow-lg">
                                            {found[item.id]}
                                        </div>
                                    )}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Badge Overlay */}
                    {badge && (
                        <div className="fixed inset-0 bg-stone-900/95 z-[100] flex flex-col items-center justify-center p-8 text-center" onClick={() => setBadge(false)}>
                            <span className="text-[120px] animate-bounce mb-8">🎖️</span>
                            <h2 className="kids-font text-5xl text-white mb-2 uppercase tracking-widest leading-none">Master Ranger</h2>
                            <h3 className="kids-font text-8xl text-yellow-400 underline italic leading-none">ROWAN</h3>
                            <button className="mt-12 bg-white text-stone-900 kids-font text-4xl px-16 py-8 rounded-full shadow-2xl">GO ROWAN!</button>
                        </div>
                    )}

                    {/* Footer Tools */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md p-4 flex justify-around border-t-8 border-stone-200 z-50">
                        <button onClick={() => speak(`Hey Rowan! Did you know? ${getRandom(FACTS)}`)} 
                            className="footer-btn bg-blue-500 text-white rounded-3xl flex items-center justify-center shadow-xl active:translate-y-2">
                            <span className="text-5xl emoji-shadow">🧐</span>
                        </button>
                        <button onClick={startListening} className="footer-btn bg-indigo-500 text-white rounded-3xl flex items-center justify-center shadow-xl active:translate-y-2">
                            <span className="text-5xl emoji-shadow">👂</span>
                        </button>
                        <button onClick={doTrashHero} className="footer-btn bg-emerald-500 text-white rounded-3xl flex items-center justify-center shadow-xl active:translate-y-2 relative">
                            <span className="text-5xl emoji-shadow">🚮</span>
                            {trashCount > 0 && <div className="absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs kids-font border-2 border-white shadow-md">{trashCount}</div>}
                        </button>
                        <button onClick={() => speak(getRandom(JOKES))} 
                            className="footer-btn bg-yellow-400 text-yellow-900 rounded-3xl flex items-center justify-center shadow-xl active:translate-y-2">
                            <span className="text-5xl emoji-shadow">😂</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
